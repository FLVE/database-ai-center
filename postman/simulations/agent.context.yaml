claims:
  - claim: The real HTTP adapter and Engine retain rule findings on model failure.
    status: verified_locally
    verification: 2026-10-31, 6 passed; Postman log showed six POST requests, statuses 200/401/429/503/200/200.
    reason: Success, auth failure, throttling, service failure, delayed response and forged reference were exercised. No real provider was contacted.
  - claim: The adapter uses one Chat Completions function call named propose_checks.
    status: contract
    source: https://developers.openai.com/api/docs/guides/function-calling
    verification: tests/unit/test_agent.py and tests/integration/test_agent_simulation.py
    reason: Only the consumed protocol subset is modeled; unknown routes return 501.
  - claim: No real model service or external credentials are used by this simulation.
    status: design
    verification: The model field selects a local success, error, timeout or injection fixture.
    reason: Provider compatibility, actual inference quality and billing remain unverified.
  - claim: Owner workspace mock discovery was skipped.
    status: observed
    verification: postman whoami returned no account details.
    reason: This local repository fixture has no cloud workspace or publishing dependency.
assumptions:
  - id: m4-final-mysql-provider-regression
    status: supported
    claim: PostgreSQL and Doris routing preserve the existing MySQL model success and failure behavior.
    reason: Both request dialects passed success, auth, throttling, unavailable, timeout and forged-reference scenarios. New database types use NullAgent and separate real database tests.
    verification: 2026-10-31; final host suite 447 passed, 23 skipped; two complete runs recorded 24 HTTP requests. Real provider deployment verification remains separate.
    source: tests/integration/test_agent_simulation.py; tests/unit/test_remaining_m4_api.py; dist/m4-full-simulation.ndjson (ignored local log)
    updated_at: "2026-10-31"
  - id: m42-mysql-provider-regression
    status: supported
    claim: MongoDB routing additions preserve the existing MySQL model success and fallback behavior in the local scenarios.
    reason: Both request dialects passed the six existing HTTP scenarios; MongoDB uses NullAgent and is independently tested with a real isolated MongoDB. This does not revalidate the real DeepSeek service.
    verification: 2026-10-31; host suite 394 passed, 18 skipped included 12 model simulation cases. The simulation log recorded 12 POST requests across /v1/chat/completions and /beta/chat/completions.
    source: tests/integration/test_agent_simulation.py; tests/unit/test_mongodb_api.py; dist/m42-agent-simulation.ndjson (local ignored log)
    updated_at: "2026-10-31"
  - id: m4-mysql-provider-regression
    status: supported
    claim: The MySQL model adapter retains bounded suggestions and rule fallback for both request dialects during M4.1 changes.
    reason: The existing real HTTP simulation covered success, 401, 429, 503, timeout and forged references for generic and DeepSeek requests. This is client regression evidence, not a new real-provider validation.
    verification: 2026-10-31; host full suite 334 passed, 15 skipped included all 12 simulation cases; simulation log recorded 12 POST requests across /v1/chat/completions and /beta/chat/completions.
    source: tests/integration/test_agent_simulation.py; postman/mocks/llm/default.js; dist/m4-simulation.ndjson (local ignored run log)
    updated_at: "2026-10-31"
