[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbic"
version = "0.3.0"
description = "Database AI Center M2"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyMySQL[rsa]>=1.1,<2", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=2.3,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicit local database or HTTP fixture access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pymysql.*", "yaml"]
ignore_missing_imports = true

