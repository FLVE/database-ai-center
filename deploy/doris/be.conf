be_port = 9060
LOG_DIR="${DORIS_HOME}/log"
JAVA_OPTS_FOR_JDK_17="-Xmx512m -Dfile.encoding=UTF-8 -DlogPath=$LOG_DIR/jni.log --add-opens=java.base/java.nio=ALL-UNNAMED"
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
arrow_flight_sql_port = -1
